<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 532" width="1000" height="532" role="img" aria-label="HomeLog features">
<rect width="1000" height="532" rx="18" fill="#050a14"/>
<g transform="translate(20,20)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14 14 5l10 9M7 12v11h14V12M12 23v-7h4v7"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">A real dashboard</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">A swipeable photo gallery, an</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">interactive 3D model, build vitals,</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">and a count of what needs attention.</text></g><g transform="translate(348,20)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="M14 8v6l4 3"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Service schedules</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Set an interval once. Each system</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">shows as on schedule, due soon, or</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">overdue.</text></g><g transform="translate(676,20)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10V5h5M19 5h5v5M24 18v5h-5M9 23H4v-5M8 14h12"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Scan a nameplate</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Photograph an appliance label. AI</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">reads the model, serial, and specs</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">into a new asset.</text></g><g transform="translate(20,192)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h18v12H12l-5 5v-5H5z"/><path d="M10 11h8M10 14.5h5"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Troubleshooter</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Ask about an error code. It searches</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">the web for manuals and known issues</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">on your exact model.</text></g><g transform="translate(348,192)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="18" height="18" rx="3" stroke-dasharray="3 3"/><path d="M14 10v8M10 14h8"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Spots the gaps</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Tracks a washer but no dryer? It</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">flags the gaps before you find them</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">the hard way.</text></g><g transform="translate(676,192)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="9" height="9" rx="2"/><rect x="15" y="4" width="9" height="9" rx="2"/><rect x="4" y="15" width="9" height="9" rx="2"/><path d="M15 24l9-9"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Colors and finishes</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Paint codes, tile, cabinets, and</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">fixtures from the builder's</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">selection sheets, by room.</text></g><g transform="translate(20,364)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h10l6 6v14H6zM16 4v6h6M10 15h8M10 19h8"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">A filing cabinet</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Plans, permits, warranties, and</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">policies. Stored locally and</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">available offline.</text></g><g transform="translate(348,364)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h4l2 6-3 2c1.5 3 3.500 5 6.500 6.500l2-3 6 2v4c0 1-1 2-2 2C13 23.500 4.500 15 6 6c0-1 1-2 2-2z" transform="scale(.92) translate(1 1)"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Every number</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Appraiser, tax collector, insurer,</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">builder. One tap to call or open the</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">site.</text></g><g transform="translate(676,364)"><rect width="304" height="148" rx="14" fill="#121e35" stroke="#d4a949" stroke-opacity="0.18"/><g transform="translate(20,20)"><circle cx="22" cy="22" r="22" fill="#3fd0c9" fill-opacity="0.09" stroke="#3fd0c9" stroke-opacity="0.35"/><g transform="translate(8,8)" fill="none" stroke="#d4a949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="m17.500 17.500 6 6"/></g></g><text x="78" y="49" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="19" font-weight="700" fill="#f4f1e9">Search everything</text><text x="20" y="92" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">One bar covers assets, finishes,</text>
<text x="20" y="111" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">documents, and contacts. AI search</text>
<text x="20" y="130" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">steps in when text can't.</text></g>
<rect x="0.5" y="0.5" width="999" height="531" rx="17.500" fill="none" stroke="#d4a949" stroke-opacity="0.3"/>
</svg>