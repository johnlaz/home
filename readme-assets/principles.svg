<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="How HomeLog is built">
<rect width="1000" height="210" rx="18" fill="#050a14"/>
<g transform="translate(20,20)"><rect width="304" height="170" rx="14" fill="#121e35" stroke="#3fd0c9" stroke-opacity="0.22"/><rect x="20" y="22" width="30" height="3" rx="1.5" fill="#3fd0c9"/><text x="20" y="56" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="18" font-weight="700" fill="#f4f1e9">Stays on your device</text><text x="20" y="93" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Assets, photos, and documents live</text>
<text x="20" y="112" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">in the browser. There is no server.</text>
<text x="20" y="131" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">AI sees only the text it needs, and</text>
<text x="20" y="150" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">only when you ask.</text></g><g transform="translate(348,20)"><rect width="304" height="170" rx="14" fill="#121e35" stroke="#3fd0c9" stroke-opacity="0.22"/><rect x="20" y="22" width="30" height="3" rx="1.5" fill="#3fd0c9"/><text x="20" y="56" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="18" font-weight="700" fill="#f4f1e9">Installs like an app</text><text x="20" y="93" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Home screen icon, offline-capable,</text>
<text x="20" y="112" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">no app store. One HTML file that</text>
<text x="20" y="131" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">runs anywhere a browser does.</text></g><g transform="translate(676,20)"><rect width="304" height="170" rx="14" fill="#121e35" stroke="#3fd0c9" stroke-opacity="0.22"/><rect x="20" y="22" width="30" height="3" rx="1.5" fill="#3fd0c9"/><text x="20" y="56" font-family="Georgia,'Playfair Display','Times New Roman',serif" font-size="18" font-weight="700" fill="#f4f1e9">No login, no fee</text><text x="20" y="93" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">Bring a free Groq API key for the AI</text>
<text x="20" y="112" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">features, or skip them. The core app</text>
<text x="20" y="131" font-family="'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#c9cfdb">works either way.</text></g>
<rect x="0.5" y="0.5" width="999" height="209" rx="17.500" fill="none" stroke="#d4a949" stroke-opacity="0.3"/>
</svg>